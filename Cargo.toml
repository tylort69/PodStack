[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/tylort69/PodStack"

[workspace.dependencies]
podstack-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "process"] }
reqwest = { version = "0.13", features = ["json", "form", "query", "gzip"] }
thiserror = "2"
tracing = "0.1"
futures = "0.3"
regex = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 1
