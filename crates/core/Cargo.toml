[package]
name = "podstack-core"
description = "EVE Online data layer for PodStack: SSO, ESI, storage and character models"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio.workspace = true
reqwest.workspace = true
thiserror.workspace = true
tracing.workspace = true
futures.workspace = true
regex.workspace = true
base64 = "0.22"
sha2 = "0.10"
rand = "0.9"
url = "2"
dirs = "6"
parking_lot = "0.12"
# password-protected backups
aes-gcm = "0.10"
argon2 = "0.5"
# CCP ships its static data as a zip
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Security", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell"] }
