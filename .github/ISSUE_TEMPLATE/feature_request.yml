name: Feature request
description: Suggest something PodStack should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you're trying to get done in EVE and where PodStack falls short.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could PodStack help?
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Screenshots, spreadsheets you use today, or similar tools.
